name: Roclub
description: >-
  roclub (roclub GmbH) is a German health-tech company operating a remote-control
  platform for diagnostic medical imaging. Its software lets healthcare
  organizations perform MRI and CT examinations remotely ("Remote Scanning") and
  support on-site technicians from anywhere ("Remote Support"), with real-time
  screen sharing and device control across multi-vendor scanners (Siemens,
  Philips, GE, Canon). roclub also runs a marketplace of qualified medical
  technologists ("rocStars") who can be booked on demand, together with session
  documentation, scheduling, and built-in liability insurance ("roCover"). It was
  surfaced as a portfolio company of Speedinvest and added to the API Evangelist
  network. No public developer API, developer portal, or machine-readable API
  documentation was found during enrichment.
